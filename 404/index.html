<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Jaringan Tidak Terhubung</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 overflow-hidden relative font-['Poppins']">

    <!-- Canvas Dust & Electric Spark Particles -->
    <canvas id="sandSparkCanvas" class="fixed inset-0 pointer-events-none z-30"></canvas>

    <!-- Ambient Neon Halos -->
    <div class="fixed -top-20 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-sky-500/10 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="fixed -bottom-20 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- MAIN GLASSMORPHISM CARD -->
    <div class="relative z-10 w-full max-w-3xl bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] flex flex-col items-center text-center space-y-4">
        
        <!-- Sound Toggle & Status Bar -->
        <div class="w-full flex items-center justify-between gap-2 px-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/80 text-cyan-400 text-xs font-semibold tracking-wide backdrop-blur-md shadow-lg">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <i class="fa-solid fa-wifi text-xs"></i>
                <span>STATUS: KONEKSI TERPUTUS</span>
            </div>

            <button id="soundToggleBtn" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/80 text-xs font-medium text-slate-300 hover:text-cyan-400 transition-colors cursor-pointer">
                <i id="soundIcon" class="fa-solid fa-volume-xmark text-cyan-400"></i>
                <span id="soundText">Suara: Off</span>
            </button>
        </div>

        <!-- 404 Header -->
        <div class="relative select-none my-1">
            <h1 class="glitch-404 text-7xl sm:text-8xl font-black font-['Orbitron'] tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-slate-100 via-cyan-300 to-slate-600 drop-shadow-[0_10px_25px_rgba(0,0,0,0.9)]">
                404
            </h1>
            <span class="absolute top-0 left-0 w-full text-7xl sm:text-8xl font-black font-['Orbitron'] tracking-widest text-cyan-500/20 blur-sm pointer-events-none">404</span>
        </div>

        <!-- SCENE WITH CHARACTER & LOOPING ANIMATION -->
        <div id="desertStage" class="relative w-full h-72 sm:h-80 flex items-center justify-center cursor-pointer">
            <svg id="sceneSvg" viewBox="0 0 800 360" class="w-full h-full overflow-visible">
                
                <path d="M 0,280 Q 200,240 400,270 Q 600,300 800,260 L 800,360 L 0,360 Z" fill="#1e1b18" />
                <path d="M 0,295 Q 250,280 500,300 Q 650,290 800,295 L 800,360 L 0,360 Z" fill="#0f0e0d" />

                <!-- SILHOUETTE CACTI & TREES -->
                <g fill="#29221d">
                    <rect x="70" y="190" width="16" height="90" rx="8" />
                    <path d="M 50,210 L 70,210 L 70,225 L 50,225 Q 40,225 40,210 L 40,180 A 8,8 0 0,1 56,180 L 56,210 Z" />
                    <path d="M 86,225 L 106,225 L 106,200 A 8,8 0 0,1 122,200 L 122,230 Q 122,240 106,240 L 86,240 Z" />
                </g>
                <path d="M 160,280 L 175,170 Q 185,150 170,130 M 172,180 Q 140,160 120,165 M 174,160 Q 200,140 215,145" fill="none" stroke="#29221d" stroke-width="6" stroke-linecap="round" />

                <g fill="#29221d">
                    <rect x="710" y="200" width="18" height="80" rx="9" />
                    <path d="M 690,220 L 710,220 L 710,235 L 690,235 Q 680,235 680,220 L 680,195 A 8,8 0 0,1 696,195 L 696,220 Z" />
                </g>
                <path d="M 620,285 L 632,185 Q 640,160 625,140 M 630,195 Q 600,175 580,180 M 631,170 Q 660,150 675,155" fill="none" stroke="#29221d" stroke-width="5" stroke-linecap="round" />

                <line x1="100" y1="280" x2="100" y2="120" stroke="#332a24" stroke-width="6" />
                <line x1="80" y1="130" x2="120" y2="130" stroke="#332a24" stroke-width="4" />
                <line x1="700" y1="280" x2="700" y2="120" stroke="#332a24" stroke-width="6" />
                <line x1="680" y1="130" x2="720" y2="130" stroke="#332a24" stroke-width="4" />

                <ellipse cx="400" cy="285" rx="110" ry="14" fill="rgba(0,0,0,0.6)" class="blur-md"/>

                <!-- CHARACTER -->
                <g id="characterGroup">
                    <path d="M 365,280 L 380,220 L 400,195" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 435,280 L 420,220 L 400,195" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
                    
                    <ellipse cx="355" cy="282" rx="18" ry="8" fill="#0f172a" />
                    <ellipse cx="445" cy="282" rx="18" ry="8" fill="#0f172a" />

                    <path d="M 375,195 L 425,195 L 415,120 L 385,120 Z" fill="#334155" stroke="#1e293b" stroke-width="3"/>
                    
                    <g id="headGroup">
                        <circle id="faceSkin" cx="400" cy="85" r="26" fill="#f87171" />
                        <path id="hairPath" d="M 374,80 Q 385,45 400,50 Q 415,45 426,80 Q 405,65 400,68 Q 395,65 374,80 Z" fill="#0f172a" />
                        <path d="M 420,75 Q 425,70 422,82 Q 418,82 420,75" fill="#38bdf8" />
                        <circle cx="390" cy="84" r="3" fill="#0f172a"/>
                        <circle cx="410" cy="84" r="3" fill="#0f172a"/>
                        <rect x="392" y="94" width="16" height="8" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
                    </g>

                    <g id="leftPullGroup">
                        <path id="leftCable" d="M 100,130 Q 200,230 330,145" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
                        <path d="M 385,130 Q 355,140 330,145" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" />
                        <circle cx="330" cy="145" r="10" fill="#f87171" />
                        <rect x="325" y="138" width="24" height="14" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="2" />
                        <line x1="349" y1="141" x2="356" y2="139" stroke="#ef4444" stroke-width="2.5"/>
                        <line x1="349" y1="145" x2="357" y2="145" stroke="#38bdf8" stroke-width="2.5"/>
                        <line x1="349" y1="149" x2="355" y2="151" stroke="#10b981" stroke-width="2.5"/>
                    </g>

                    <g id="rightPullGroup">
                        <path id="rightCable" d="M 700,130 Q 600,230 470,145" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
                        <path d="M 415,130 Q 445,140 470,145" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" />
                        <circle cx="470" cy="145" r="10" fill="#f87171" />
                        <rect x="451" y="138" width="24" height="14" rx="3" fill="#334155" stroke="#38bdf8" stroke-width="2" />
                        <line x1="451" y1="141" x2="444" y2="139" stroke="#ef4444" stroke-width="2.5"/>
                        <line x1="451" y1="145" x2="443" y2="145" stroke="#38bdf8" stroke-width="2.5"/>
                        <line x1="451" y1="149" x2="445" y2="151" stroke="#10b981" stroke-width="2.5"/>
                    </g>

                    <path id="lightningArc" d="M 357,145 Q 400,125 443,145" fill="none" stroke="#fef08a" stroke-width="4" opacity="0" class="drop-shadow-[0_0_15px_rgba(250,204,21,1)]" />
                </g>
            </svg>
        </div>

        <!-- Retry Counter -->
        <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-950/60 border border-slate-800 px-4 py-1.5 rounded-xl">
            <i class="fa-solid fa-rotate-right text-cyan-400"></i>
            <span>Upaya Sambung Ulang: <strong id="retryCounter" class="text-cyan-400 font-bold">0</strong> kali</span>
        </div>

        <!-- Professional Description -->
        <div class="space-y-1.5 max-w-md">
            <h2 class="text-xl font-bold text-white tracking-wide">Periksa Sambungan Internet Anda</h2>
            <p class="text-xs text-slate-400 leading-relaxed">
                Kami mendeteksi gangguan koneksi pada jaringan Anda. Silakan pastikan kabel LAN/Wi-Fi terpasang dengan benar atau coba muat ulang halaman.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center gap-3 pt-2 w-full max-w-sm">
            <button id="retryConnectionBtn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-sky-600 hover:from-cyan-400 hover:to-sky-500 text-slate-950 font-bold rounded-2xl shadow-lg shadow-cyan-500/25 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-rotate text-sm"></i>
                <span>Coba Muat Ulang</span>
            </button>
            <a href="#" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold rounded-2xl border border-slate-800 transition-all duration-300 flex items-center justify-center gap-2 hover:border-slate-700">
                <i class="fa-solid fa-house text-sm"></i>
                <span>Kembali ke Beranda</span>
            </a>
        </div>

    </div>

    <!-- Custom JavaScript Code -->
    <script>
        let audioCtx = null;
        let isAudioMuted = true;

        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        soundToggleBtn.addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioMuted = !isAudioMuted;
            if (!isAudioMuted) {
                soundIcon.className = "fa-solid fa-volume-high text-cyan-400";
                soundText.textContent = "Suara: On";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-cyan-400";
                soundText.textContent = "Suara: Off";
            }
        });

        function playElectricShockSound() {
            if (isAudioMuted || !audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.25;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 2500;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (e) {}
        }

        const canvas = document.getElementById('sandSparkCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, type = 'dust') {
                this.type = type;
                this.x = x !== undefined ? x : Math.random() * canvas.width;
                this.y = y !== undefined ? y : Math.random() * canvas.height;
                this.size = type === 'spark' ? Math.random() * 4 + 1.5 : Math.random() * 2 + 0.5;
                this.speedX = type === 'spark' ? (Math.random() - 0.5) * 18 : Math.random() * 0.8 + 0.2;
                this.speedY = type === 'spark' ? (Math.random() - 0.5) * 18 : (Math.random() - 0.5) * 0.4;
                this.life = 1;
                this.decay = type === 'spark' ? Math.random() * 0.08 + 0.04 : 0;
                this.color = type === 'spark' ? (Math.random() > 0.4 ? '#fef08a' : '#38bdf8') : 'rgba(56, 189, 248, 0.15)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.type === 'spark') {
                    this.life -= this.decay;
                } else {
                    if (this.x > canvas.width) this.x = 0;
                    if (this.y < 0 || this.y > canvas.height) this.y = Math.random() * canvas.height;
                }
            }
            draw() {
                ctx.save();
                if (this.type === 'spark') {
                    ctx.globalAlpha = Math.max(this.life, 0);
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;
                }
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function createSparkBurst(x, y, count = 50) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, 'spark'));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.type === 'spark' && p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        const leftPullGroup = document.getElementById('leftPullGroup');
        const rightPullGroup = document.getElementById('rightPullGroup');
        const headGroup = document.getElementById('headGroup');
        const hairPath = document.getElementById('hairPath');
        const faceSkin = document.getElementById('faceSkin');
        const lightningArc = document.getElementById('lightningArc');
        const stage = document.getElementById('desertStage');
        const retryCounterEl = document.getElementById('retryCounter');
        const retryConnectionBtn = document.getElementById('retryConnectionBtn');

        let retryCount = 0;

        function startInfiniteShockLoop() {
            const stageRect = stage.getBoundingClientRect();
            const centerX = stageRect.left + stageRect.width / 2;
            const centerY = stageRect.top + stageRect.height / 2 - 20;

            const shockTl = gsap.timeline({
                repeat: -1,
                repeatDelay: 0.8
            });

            shockTl.to(leftPullGroup, { x: 65, duration: 1.2, ease: "power1.inOut" })
            .to(rightPullGroup, { x: -65, duration: 1.2, ease: "power1.inOut" }, "-=1.2")
            .to(headGroup, { y: 6, duration: 1.2, ease: "power1.inOut" }, "-=1.2")
            
            .call(() => {
                lightningArc.style.opacity = '1';
                createSparkBurst(centerX, centerY, 60);
                playElectricShockSound();
                
                hairPath.setAttribute("d", "M 374,80 Q 370,20 400,10 Q 430,20 426,80 Q 405,65 400,68 Q 395,65 374,80 Z");
                faceSkin.setAttribute("fill", "#67e8f9");

                retryCount++;
                retryCounterEl.textContent = retryCount;
            })
            .to('#characterGroup', {
                x: "+=10", duration: 0.04, repeat: 12, yoyo: true, ease: "sine.inOut"
            })
            .call(() => {
                lightningArc.style.opacity = '0';
                hairPath.setAttribute("d", "M 374,80 Q 385,45 400,50 Q 415,45 426,80 Q 405,65 400,68 Q 395,65 374,80 Z");
                faceSkin.setAttribute("fill", "#f87171");
            })
            .to(leftPullGroup, { x: -15, duration: 0.4, ease: "back.out(2)" })
            .to(rightPullGroup, { x: 15, duration: 0.4, ease: "back.out(2)" }, "-=0.4")
            .to(headGroup, { y: 0, duration: 0.4, ease: "power1.out" }, "-=0.4")
            .to([leftPullGroup, rightPullGroup], { x: 0, duration: 0.5, ease: "power1.out" });
        }

        retryConnectionBtn.addEventListener('click', () => {
            const stageRect = stage.getBoundingClientRect();
            const centerX = stageRect.left + stageRect.width / 2;
            const centerY = stageRect.top + stageRect.height / 2 - 20;

            createSparkBurst(centerX, centerY, 100);
            playElectricShockSound();
            
            gsap.fromTo('#characterGroup', 
                { scale: 1.08 },
                { scale: 1, duration: 0.4, ease: "bounce.out" }
            );
        });

        window.addEventListener('load', () => {
            setTimeout(startInfiniteShockLoop, 500);
        });
    </script>
</body>
</html>
