<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Circular Login & Register</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS External -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene">
    <!-- Animated Outer Glowing Ring -->
    <div class="glow-ring"></div>

    <!-- 3D Card Container -->
    <div class="card" id="card">
      
      <!-- FRONT FACE: LOGIN -->
      <div class="card-face card-front">
        <h2>WELCOME</h2>
        <p class="subtitle">Login to your account</p>

        <form id="loginForm" onsubmit="handleAuth(event, 'LOGIN')">
          <div class="input-group">
            <input type="email" placeholder="Email Address" required autocomplete="off">
          </div>

          <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Password" required>
            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('loginPassword', this)"></i>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox"> Remember me
            </label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>

          <button type="submit" class="btn-submit" id="btnLogin">LOGIN</button>
        </form>

        <p class="switch-text">
          Don't have an account? <a onclick="flipCard()">Sign Up</a>
        </p>
      </div>

      <!-- BACK FACE: REGISTER -->
      <div class="card-face card-back">
        <h2>CREATE ACCOUNT</h2>
        <p class="subtitle">Join us to get started</p>

        <form id="registerForm" onsubmit="handleAuth(event, 'REGISTER')">
          <div class="input-group">
            <input type="text" placeholder="Full Name" required autocomplete="off">
          </div>

          <div class="input-group">
            <input type="email" placeholder="Email Address" required autocomplete="off">
          </div>

          <div class="input-group">
            <input type="password" id="regPassword" placeholder="Password" required>
            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('regPassword', this)"></i>
          </div>

          <button type="submit" class="btn-submit" id="btnRegister">REGISTER</button>
        </form>

        <p class="switch-text">
          Already have an account? <a onclick="flipCard()">Sign In</a>
        </p>
      </div>

    </div>
  </div>

  <script>
    // Flip Card Function
    function flipCard() {
      const card = document.getElementById('card');
      card.classList.toggle('flipped');
    }

    // Toggle Password Visibility
    function togglePass(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Handle Form Submit with Loading Animation
    function handleAuth(event, type) {
      event.preventDefault();
      const btn = type === 'LOGIN' ? document.getElementById('btnLogin') : document.getElementById('btnRegister');
      
      btn.classList.add('loading');
      btn.innerText = type === 'LOGIN' ? 'LOGGING IN' : 'REGISTERING';

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.innerText = type === 'LOGIN' ? 'LOGIN' : 'REGISTER';
        alert(`${type} Berhasil!`);
      }, 2000);
    }
  </script>
</body>
</html>
