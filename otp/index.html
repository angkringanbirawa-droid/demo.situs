<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vortex Fusion OTP Form</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 overflow-hidden relative font-['Poppins']">

    <!-- Canvas Background for Particle Dust & Vortex Stars -->
    <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Glowing Background Ambient Orbs -->
    <div id="ambientOrb1" class="fixed top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none animate-pulse transition-all duration-500"></div>
    <div id="ambientOrb2" class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none animate-pulse transition-all duration-500"></div>

    <!-- MAIN OTP CARD CONTAINER -->
    <div id="otpContainer" class="relative z-10 w-full max-w-md bg-slate-900/85 backdrop-blur-2xl border border-slate-800/80 rounded-3xl p-8 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8)] overflow-hidden transition-all duration-500 min-h-[460px] flex flex-col justify-between">
        
        <!-- TOP ACCENT SHINE -->
        <div id="topAccent" class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent transition-all duration-500"></div>

        <!-- ================= HEADER SECTION ================= -->
        <div id="headerSection" class="text-center z-10">
            <div id="shieldIcon" class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-500 text-slate-950 shadow-lg shadow-cyan-500/25 mb-4 transition-all duration-500">
                <i class="fa-solid fa-shield-halved text-3xl"></i>
            </div>
            <h2 id="titleText" class="text-2xl font-bold text-white tracking-wide">Verifikasi OTP</h2>
            <p id="subTitleText" class="text-xs text-slate-400 mt-2 leading-relaxed">
                Kode 6 digit telah dikirimkan ke <span class="text-cyan-400 font-medium">+62 812-****-5678</span>
            </p>
            <!-- Error Alert Message -->
            <div id="errorMessage" class="hidden items-center justify-center gap-2 text-rose-400 text-xs font-semibold mt-3 bg-rose-950/40 border border-rose-500/30 rounded-xl py-2 px-3 animate-bounce">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="errorText">Kode OTP salah! Silakan coba lagi.</span>
            </div>
        </div>

        <!-- ================= STAGE AREA FOR OTP BOXES & VORTEX FUSION ================= -->
        <div id="stageArea" class="relative my-6 h-20 flex items-center justify-center">
            
            <!-- 6 OTP DIGIT BOXES CONTAINER -->
            <div id="otpBoxesGroup" class="flex items-center justify-center gap-2 sm:gap-3 w-full">
                <div class="otp-box relative">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-13 sm:h-16 text-center text-2xl font-bold bg-slate-950/80 border border-slate-700/80 rounded-2xl text-cyan-400 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 transition-all shadow-inner" autofocus autocomplete="off">
                </div>
                <div class="otp-box relative">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-13 sm:h-16 text-center text-2xl font-bold bg-slate-950/80 border border-slate-700/80 rounded-2xl text-cyan-400 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 transition-all shadow-inner" autocomplete="off">
                </div>
                <div class="otp-box relative">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-13 sm:h-16 text-center text-2xl font-bold bg-slate-950/80 border border-slate-700/80 rounded-2xl text-cyan-400 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 transition-all shadow-inner" autocomplete="off">
                </div>
                <div class="otp-box relative">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-13 sm:h-16 text-center text-2xl font-bold bg-slate-950/80 border border-slate-700/80 rounded-2xl text-cyan-400 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 transition-all shadow-inner" autocomplete="off">
                </div>
                <div class="otp-box relative">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-13 sm:h-16 text-center text-2xl font-bold bg-slate-950/80 border border-slate-700/80 rounded-2xl text-cyan-400 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 transition-all shadow-inner" autocomplete="off">
                </div>
                <div class="otp-box relative">
                    <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-13 sm:h-16 text-center text-2xl font-bold bg-slate-950/80 border border-slate-700/80 rounded-2xl text-cyan-400 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/40 transition-all shadow-inner" autocomplete="off">
                </div>
            </div>

            <!-- CENTRAL FUSION ENERGY ORB -->
            <div id="fusionOrb" class="absolute z-20 w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-400 via-teal-300 to-emerald-400 flex items-center justify-center text-slate-950 opacity-0 scale-0 shadow-[0_0_50px_rgba(6,182,212,0.9)]">
                <i class="fa-solid fa-atom text-2xl animate-spin"></i>
            </div>

            <!-- SUCCESS 3D CHECKMARK ICON -->
            <div id="successIcon" class="absolute z-30 w-20 h-20 rounded-full bg-gradient-to-tr from-emerald-400 to-teal-500 text-slate-950 flex items-center justify-center text-4xl shadow-[0_0_50px_rgba(52,211,153,0.9)] opacity-0 scale-0">
                <i class="fa-solid fa-check text-slate-950 font-bold"></i>
            </div>
        </div>

        <!-- ================= FOOTER SECTION ================= -->
        <div id="footerSection" class="space-y-4 z-10">
            <button id="verifyBtn" disabled onclick="validateAndSubmitOtp()" class="w-full py-4 bg-slate-800 text-slate-500 font-semibold rounded-2xl shadow-lg transition-all duration-300 flex items-center justify-center gap-2 cursor-not-allowed">
                <span>Verifikasi Kode</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>

            <!-- Demo Hint Info -->
            <p class="text-[11px] text-center text-slate-500 italic">
                *Demo Tip: Masukkan kode <span class="text-cyan-400 font-semibold">123456</span> untuk Benar, selain itu dianggap Salah.
            </p>

            <div id="timerContainer" class="text-center text-xs text-slate-400">
                <span>Tidak menerima kode? </span>
                <button id="resendBtn" disabled class="text-slate-500 font-semibold cursor-not-allowed transition-colors ml-1">
                    Kirim Ulang (<span id="timer">30</span>s)
                </button>
            </div>

            <div id="loadingBarContainer" class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden border border-slate-800 opacity-0">
                <div id="loadingBar" class="bg-gradient-to-r from-emerald-400 to-teal-300 h-full w-0 transition-all duration-1000"></div>
            </div>
        </div>

    </div>

    <!-- Custom JavaScript Code -->
    <script>
        // Canvas Particle Background
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(6, 182, 212, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // OTP Input Focus & Logic Handler
        const digits = document.querySelectorAll('.otp-digit');
        const verifyBtn = document.getElementById('verifyBtn');
        const errorMessage = document.getElementById('errorMessage');
        let isSequenceRunning = false;

        digits.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                errorMessage.classList.add('hidden'); // Sembunyikan error saat ngetik
                
                if (val.length >= 1) {
                    e.target.value = val.substring(0, 1);
                    gsap.fromTo(e.target, { scale: 0.85 }, { scale: 1, duration: 0.2, ease: "back.out(2)" });
                    if (index < digits.length - 1) {
                        digits[index + 1].focus();
                    }
                }
                checkOtpComplete();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    digits[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').trim();
                if (/^\d+$/.test(pasteData)) {
                    const pasteDigits = pasteData.split('');
                    digits.forEach((digitInput, i) => {
                        if (pasteDigits[i]) {
                            digitInput.value = pasteDigits[i];
                            gsap.fromTo(digitInput, { scale: 0.85 }, { scale: 1, duration: 0.2, delay: i * 0.04 });
                        }
                    });
                    if (pasteDigits.length >= digits.length) {
                        digits[digits.length - 1].focus();
                    }
                    checkOtpComplete();
                }
            });
        });

        function checkOtpComplete() {
            if (isSequenceRunning) return;
            const isFilled = Array.from(digits).every(input => input.value.trim() !== '');
            if (isFilled) {
                verifyBtn.disabled = false;
                verifyBtn.className = "w-full py-4 bg-gradient-to-r from-cyan-500 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 text-slate-950 font-bold rounded-2xl shadow-lg shadow-cyan-500/30 transition-all duration-300 hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer";
                
                // Auto validate saat 6 digit terisi
                validateAndSubmitOtp();
            } else {
                verifyBtn.disabled = true;
                verifyBtn.className = "w-full py-4 bg-slate-800 text-slate-500 font-semibold rounded-2xl shadow-lg transition-all duration-300 flex items-center justify-center gap-2 cursor-not-allowed";
            }
        }

        // FUNGSI CEK KODE BENAR ATAU SALAH
        function validateAndSubmitOtp() {
            if (isSequenceRunning) return;
            
            // Ambil gabungan nilai kode OTP
            const enteredOtp = Array.from(digits).map(input => input.value.trim()).join('');

            // Untuk testing: Kode "123456" dianggap BENAR, selebihnya SALAH
            if (enteredOtp === "123456") {
                startVortexFusionSequence(); // Jalankan animasi sukses
            } else {
                triggerErrorShakeAnimation(); // Jalankan animasi error bergetar
            }
        }

        // ANIMASI KODE SALAH (RED SHAKE & RESET)
        function triggerErrorShakeAnimation() {
            isSequenceRunning = true;
            const boxes = document.querySelectorAll('.otp-digit');
            
            // Tampilkan pesan error
            errorMessage.classList.remove('hidden');
            errorMessage.classList.add('flex');

            // 1. Shake / Bergetar & Berubah warna Merah Warning
            gsap.timeline({
                onComplete: () => {
                    // Reset isi input & fokus kembali ke kotak pertama
                    digits.forEach(d => {
                        d.value = '';
                        d.classList.remove('is-invalid');
                    });
                    digits[0].focus();
                    checkOtpComplete();
                    isSequenceRunning = false;
                }
            })
            .to(boxes, {
                x: (i) => (i % 2 === 0 ? -12 : 12),
                borderColor: '#f43f5e',
                color: '#f43f5e',
                boxShadow: '0 0 20px rgba(244, 63, 94, 0.6)',
                duration: 0.08,
                repeat: 5,
                yoyo: true,
                ease: 'sine.inOut'
            })
            .to(boxes, {
                x: 0,
                borderColor: 'rgba(51, 65, 85, 0.8)',
                color: '#22d3ee',
                boxShadow: 'none',
                duration: 0.2
            });
        }

        // CRAZY 3D FLYING & VORTEX FUSION ANIMATION SEQUENCE (BENAR)
        function startVortexFusionSequence() {
            if (isSequenceRunning) return;
            isSequenceRunning = true;

            const boxes = document.querySelectorAll('.otp-box');
            const fusionOrb = document.getElementById('fusionOrb');
            const successIcon = document.getElementById('successIcon');
            const titleText = document.getElementById('titleText');
            const subTitleText = document.getElementById('subTitleText');
            const shieldIcon = document.getElementById('shieldIcon');

            digits.forEach(d => d.blur());
            verifyBtn.style.opacity = '0.5';
            verifyBtn.style.pointerEvents = 'none';

            gsap.to([titleText, subTitleText], { opacity: 0, y: -10, duration: 0.25, onComplete: () => {
                titleText.textContent = "Memeriksa Enkripsi...";
                subTitleText.textContent = "Menggabungkan partikel kode keamanan...";
                gsap.to([titleText, subTitleText], { opacity: 1, y: 0, duration: 0.25 });
            }});

            const tl = gsap.timeline();

            tl.to(boxes, {
                y: -30,
                scale: 1.15,
                boxShadow: "0 10px 25px rgba(6, 182, 212, 0.5)",
                duration: 0.4,
                stagger: 0.05,
                ease: "back.out(2)"
            })
            .to(boxes, {
                rotation: 720,
                x: (index) => {
                    const centerOffset = (index - 2.5) * 55;
                    return -centerOffset;
                },
                y: -10,
                scale: 0.3,
                opacity: 0.8,
                duration: 0.9,
                ease: "power3.in",
                stagger: {
                    amount: 0.3,
                    from: "edges"
                }
            })
            .to(boxes, {
                scale: 0,
                opacity: 0,
                duration: 0.2
            })
            .to(fusionOrb, {
                opacity: 1,
                scale: 1.4,
                duration: 0.3,
                ease: "back.out(2)"
            }, "-=0.2")
            .to(fusionOrb, {
                scale: 1.8,
                duration: 0.1,
                repeat: 5,
                yoyo: true,
                ease: "sine.inOut"
            })
            .call(() => {
                confetti({
                    particleCount: 100,
                    spread: 100,
                    origin: { y: 0.5 },
                    colors: ['#06b6d4', '#34d399', '#818cf8', '#f59e0b']
                });
            })
            .to(fusionOrb, {
                scale: 3,
                opacity: 0,
                duration: 0.25,
                ease: "power2.in"
            })
            .to(successIcon, {
                opacity: 1,
                scale: 1,
                duration: 0.5,
                ease: "back.out(2.2)"
            }, "-=0.1")
            .call(() => {
                shieldIcon.className = "inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-400 to-teal-500 text-slate-950 shadow-lg shadow-emerald-500/30 mb-4";
                shieldIcon.innerHTML = `<i class="fa-solid fa-lock-open text-3xl"></i>`;
                
                titleText.textContent = "Verifikasi Berhasil!";
                subTitleText.textContent = "Kode OTP terkonfirmasi. Mengalihkan akun Anda...";
                
                document.getElementById('timerContainer').style.display = 'none';
                document.getElementById('verifyBtn').style.display = 'none';
                
                const loadingBarContainer = document.getElementById('loadingBarContainer');
                const loadingBar = document.getElementById('loadingBar');
                
                loadingBarContainer.classList.remove('opacity-0');
                setTimeout(() => {
                    loadingBar.style.width = '100%';
                }, 100);
            });
        }

        // Timer Countdown for Resend Button
        let timerSeconds = 30;
        const timerEl = document.getElementById('timer');
        const resendBtn = document.getElementById('resendBtn');

        const countdown = setInterval(() => {
            timerSeconds--;
            timerEl.textContent = timerSeconds;
            
            if (timerSeconds <= 0) {
                clearInterval(countdown);
                resendBtn.disabled = false;
                resendBtn.innerHTML = 'Kirim Ulang Kode';
                resendBtn.className = 'text-cyan-400 hover:text-cyan-300 font-semibold cursor-pointer hover:underline transition-colors ml-1';
            }
        }, 1000);
    </script>
</body>
</html>
